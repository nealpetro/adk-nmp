<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1500" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">ReadyNow! — FEMA Emergency Preparedness Assistant</text>
  <text x="40" y="82" font-size="16" fill="#475569">Google ADK multi-agent system · Gemini 2.5 Flash · deployed to Agent Platform (Agent Runtime) · built and tested in Colab Enterprise</text>

  <!-- User -->
  <rect x="40" y="150" width="170" height="90" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="125" y="188" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">User</text>
  <text x="125" y="212" font-size="13" text-anchor="middle" fill="#475569">Playground / app / API</text>

  <!-- Deployment boundary -->
  <rect x="250" y="110" width="1210" height="755" rx="18" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="270" y="138" font-size="15" font-weight="600" fill="#64748b">Agent Platform deployment (Agent Runtime, us-central1)</text>

  <!-- Root callback -->
  <rect x="290" y="160" width="360" height="120" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="310" y="190" font-size="17" font-weight="700" fill="#7c2d12">screen_request  (before_agent callback)</text>
  <text x="310" y="215" font-size="14" fill="#7c2d12">1. Log the user's message (audit log)</text>
  <text x="310" y="237" font-size="14" fill="#7c2d12">2. Validate with Gemini classifier (JSON schema):</text>
  <text x="310" y="259" font-size="14" fill="#7c2d12">   OK · OFF_TOPIC · NON_US · MALICIOUS  (fails closed)</text>

  <!-- Refusal -->
  <rect x="290" y="300" width="360" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="470" y="324" font-size="14" font-weight="600" text-anchor="middle" fill="#7c2d12">Not OK → polite refusal; pipeline skipped,</text>
  <text x="470" y="344" font-size="14" font-weight="600" text-anchor="middle" fill="#7c2d12">no model or tool sees the request</text>

  <!-- Root pipeline -->
  <rect x="290" y="390" width="1140" height="190" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="310" y="420" font-size="18" font-weight="700" fill="#1e3a8a">readynow  — root SequentialAgent (validates and refines every response)</text>

  <rect x="320" y="440" width="300" height="115" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="470" y="468" font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">1. coordinator</text>
  <text x="470" y="492" font-size="13" text-anchor="middle" fill="#334155">describes capabilities, calls</text>
  <text x="470" y="511" font-size="13" text-anchor="middle" fill="#334155">specialists, writes a draft</text>
  <text x="470" y="538" font-size="13" text-anchor="middle" fill="#1d4ed8" font-family="Consolas, monospace">→ state.draft_response</text>

  <rect x="700" y="440" width="300" height="115" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="850" y="468" font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">2. response_validator</text>
  <text x="850" y="492" font-size="13" text-anchor="middle" fill="#334155">checks: direct answer, facts from tools,</text>
  <text x="850" y="511" font-size="13" text-anchor="middle" fill="#334155">plain language, next steps, 911, sources</text>
  <text x="850" y="538" font-size="13" text-anchor="middle" fill="#1d4ed8" font-family="Consolas, monospace">→ state.validation_notes</text>

  <rect x="1080" y="440" width="320" height="115" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1240" y="468" font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">3. response_refiner</text>
  <text x="1240" y="492" font-size="13" text-anchor="middle" fill="#334155">applies every fix; keeps facts and</text>
  <text x="1240" y="511" font-size="13" text-anchor="middle" fill="#334155">links; writes the final answer</text>
  <text x="1240" y="538" font-size="13" text-anchor="middle" fill="#1d4ed8" font-family="Consolas, monospace">→ state.final_response</text>

  <line x1="620" y1="497" x2="696" y2="497" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1000" y1="497" x2="1076" y2="497" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Specialists -->
  <text x="290" y="855" font-size="14" font-weight="600" fill="#334155">Specialists — called by the coordinator as tools (AgentTool); it gets their answers back and stays in charge</text>

  <rect x="290" y="640" width="360" height="190" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="310" y="668" font-size="17" font-weight="700" fill="#14532d">weather_agent</text>
  <text x="310" y="693" font-size="14" fill="#14532d" font-family="Consolas, monospace">get_coordinates</text>
  <text x="310" y="714" font-size="14" fill="#14532d" font-family="Consolas, monospace">get_weather_alerts</text>
  <text x="310" y="735" font-size="14" fill="#14532d" font-family="Consolas, monospace">get_weather</text>
  <text x="310" y="762" font-size="13" fill="#334155">Active warnings/watches + current</text>
  <text x="310" y="781" font-size="13" fill="#334155">conditions + forecast</text>
  <text x="310" y="810" font-size="13" font-weight="600" fill="#15803d">→ National Weather Service API</text>

  <rect x="700" y="640" width="360" height="190" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="720" y="668" font-size="17" font-weight="700" fill="#14532d">routes_agent</text>
  <text x="720" y="693" font-size="14" fill="#14532d" font-family="Consolas, monospace">get_route</text>
  <text x="720" y="714" font-size="14" fill="#14532d" font-family="Consolas, monospace">shelter_search_agent</text>
  <text x="720" y="742" font-size="13" fill="#334155">Official evacuation routes and open</text>
  <text x="720" y="761" font-size="13" fill="#334155">shelters; turn-by-turn directions link</text>
  <text x="720" y="790" font-size="13" font-weight="600" fill="#15803d">→ Google Search (shelters, routes)</text>
  <text x="720" y="810" font-size="13" font-weight="600" fill="#15803d">→ Google Maps directions</text>

  <rect x="1110" y="640" width="320" height="190" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1130" y="668" font-size="17" font-weight="700" fill="#14532d">search_agent</text>
  <text x="1130" y="693" font-size="14" fill="#14532d" font-family="Consolas, monospace">google_search</text>
  <text x="1130" y="722" font-size="13" fill="#334155">Disaster news and official safety</text>
  <text x="1130" y="741" font-size="13" fill="#334155">guidance (FEMA, ready.gov, NWS,</text>
  <text x="1130" y="760" font-size="13" fill="#334155">CDC, Red Cross)</text>
  <text x="1130" y="810" font-size="13" font-weight="600" fill="#15803d">→ Google Search</text>

  <!-- coordinator to specialists -->
  <path d="M430,555 L430,636" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M520,555 L520,600 L880,600 L880,636" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M580,555 L580,590 L1270,590 L1270,636" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- user flow arrows -->
  <path d="M210,195 L286,205" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="222" y="186" font-size="12" fill="#334155">message</text>
  <path d="M470,280 L470,296" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <path d="M290,328 L170,328 L170,244" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <path d="M650,220 L700,220 L700,300 L700,386" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="710" y="300" font-size="13" font-weight="600" fill="#334155">OK</text>
  <path d="M1240,440 L1240,370 L1110,370 L1110,100 L125,100 L125,146" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="1122" y="250" font-size="13" font-weight="600" fill="#1d4ed8">final answer</text>
  <text x="1122" y="268" font-size="13" font-weight="600" fill="#1d4ed8">to user</text>

  <!-- Logging -->
  <rect x="40" y="880" width="1420" height="90" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="910" font-size="16" font-weight="700" fill="#0f172a">Logging (all user-agent interactions)</text>
  <text x="60" y="935" font-size="14" fill="#334155">USER line from screen_request · MODEL lines (text + every tool call) from after_model callbacks on every agent · BLOCK lines for refusals · each line has agent + session ID</text>
  <text x="60" y="957" font-size="14" fill="#334155">Notebook: challenge6_readynow.log file  ·  Deployed: "AUDIT | ..." lines to stdout → Cloud Logging (viewable in the Agent Platform console)</text>
</svg>
